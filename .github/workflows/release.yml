name: Release

# main 上的 CI 通过后，如果 Cargo.toml 的版本号还没发布过，就构建 Windows、macOS 安装包与
# Linux 无窗口版（可执行文件 + Docker 镜像），打上 v<版本号> 标签并发布到 GitHub Releases，
# 镜像推送到 ghcr.io；这个版本已经发布过则什么也不做。
# 发版只需改版本号并在 CHANGELOG.md 写好这一版的段落。手动推送 v* 标签、在 Actions 页面
# 手动运行同样会在版本未发布时发布（手动运行遇到已发布的版本只构建产物）。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# 同一时间只跑一个发布：推 main 与推标签同时触发时，后一个会看到版本已发布而跳过。
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # workflow_run 在默认分支的最新提交上运行，要构建的是 CI 刚检查通过的那个提交。
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    name: Resolve version
    # 只认 main 上推送触发且通过的 CI；fork 的 PR 即使分支也叫 main，也不会走到发布。
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$crate" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          if gh release view "v$crate" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$crate is already released, nothing to publish"
            publish=false
          else
            # 更新说明取自 CHANGELOG.md：缺这一版的段落就别等构建完才失败。
            if ! grep -qF "## [$crate]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for $crate"
              exit 1
            fi
            publish=true
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/CFBest.exe "dist/CFBest-${{ needs.version.outputs.version }}-windows-x64.exe"
      - uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: dist/*

  macos:
    name: macOS universal
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle CF Best.app
        run: |
          app="dist/CF Best.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/CFBest" \
            target/aarch64-apple-darwin/release/CFBest \
            target/x86_64-apple-darwin/release/CFBest
          cp assets/app-icon.icns "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CF Best</string>
            <key>CFBundleDisplayName</key><string>CF Best</string>
            <key>CFBundleIdentifier</key><string>com.aigcfree.cfbest</string>
            <key>CFBundleExecutable</key><string>CFBest</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          # 未使用开发者证书，做 ad-hoc 签名，Apple 芯片上才能启动。
          codesign --force --deep --sign - "$app"
      - name: Create DMG
        run: |
          ln -s /Applications dist/Applications
          hdiutil create -volname "CF Best" -srcfolder dist -ov -format UDZO \
            "CFBest-${VERSION}-macos-universal.dmg"
          mkdir out && mv "CFBest-${VERSION}-macos-universal.dmg" out/
      - uses: actions/upload-artifact@v5
        with:
          name: release-macos
          path: out/*

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    # 各架构在原生 runner 上构建，不经 QEMU 模拟编译。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # 同一个 Dockerfile 导出静态链接的可执行文件，再打包成镜像（第二次构建复用缓存）。
      - name: Build binary
        run: |
          docker buildx build --platform ${{ matrix.platform }} --target binary --output type=local,dest=bin .
          mkdir dist
          mv bin/cfbest-cli "dist/cfbest-cli-${VERSION}-linux-${{ matrix.arch }}"
      # 供无法直连 ghcr.io 的 NAS 在管理界面里导入镜像文件。
      - name: Build offline image
        run: |
          docker buildx build --platform ${{ matrix.platform }} --tag "cf-best:${VERSION}"             --output "type=docker,dest=dist/cf-best-docker-${VERSION}-linux-${{ matrix.arch }}.tar" .
          gzip -9 "dist/cf-best-docker-${VERSION}-linux-${{ matrix.arch }}.tar"
      - uses: actions/upload-artifact@v5
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
      - uses: docker/login-action@v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 按摘要推送单架构镜像，由 docker 任务合并成多架构标签。
      - name: Push image by digest
        id: push
        if: needs.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        if: needs.version.outputs.publish == 'true'
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v5
        if: needs.version.outputs.publish == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*

  docker:
    name: Docker image
    if: needs.version.outputs.publish == 'true'
    needs: [version, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag multi-arch image
        working-directory: digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "$image:$VERSION" -t "$image:latest"             $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$VERSION"

  publish:
    name: Publish release
    if: needs.version.outputs.publish == 'true'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Release notes
        # CHANGELOG.md 中本版本的段落 + .github/release-notes.md 的下载说明。
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          python3 - <<'PY'
          import os
          changes = open("changes.md", encoding="utf-8").read().strip()
          notes = open(".github/release-notes.md", encoding="utf-8").read()
          notes = notes.replace("{{CHANGES}}", changes).replace("{{VERSION}}", os.environ["VERSION"])
          open("notes.md", "w", encoding="utf-8").write(notes)
          PY
          cat notes.md
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # 标签由这里在构建的提交上创建（GITHUB_TOKEN 创建的标签不会再触发本工作流）。
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: CF Best v${{ needs.version.outputs.version }}
          body_path: notes.md
          files: dist/*
          make_latest: "true"
